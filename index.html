<div class="form-group">
    <label>1. 原始流量渠道 (Original Traffic Source)</label>
    <select id="origSource" onchange="updateSourceDetailsOptions()">
        <option value="Other campaigns">Other campaigns</option>
        <option value="Organic social">Organic social</option>
    </select>
</div>

<div class="form-group">
    <label>2. 渠道细分 (Source Details)</label>
    <select id="sourceDetailSelect" onchange="generateSourceResult()"></select>
</div>

<div class="form-group" id="remarkGroup">
    <label>3. 备注信息 (Remark / Detail Notes)</label>
    <input type="text" id="sourceRemark" placeholder="请输入具体线索来源（如：客户邮件地址、具体电话事项等）" oninput="generateSourceResult()">
    <div class="hint">当渠道为 Other campaigns 时，请在框框中备注线索具体来源。</div>
</div>

<script>
const sourceDetailsData = {
    "Other campaigns": [
        "EN Email", "ID Email", "400 Phone", "Front Desk Phone", 
        "Website Online Chat", "From the dealer", "Hotline", "Sponsorship"
    ],
    "Organic social": [
        "Facebook", "Instagram", "LinkedIn", "Twitter", 
        "WhatsApp", "Line", "YouTube", "TikTok"
    ]
};

function updateSourceDetailsOptions() {
    const origSource = document.getElementById("origSource").value;
    const detailSelect = document.getElementById("sourceDetailSelect");
    const remarkGroup = document.getElementById("remarkGroup");

    // 清空现有选项
    detailSelect.innerHTML = "";

    // 填充对应 Source Details
    sourceDetailsData[origSource].forEach(item => {
        const opt = document.createElement("option");
        opt.value = item;
        opt.textContent = item;
        detailSelect.appendChild(opt);
    });

    // 仅在 Other campaigns 时显示备注框
    if (origSource === "Other campaigns") {
        remarkGroup.style.display = "block";
    } else {
        remarkGroup.style.display = "none";
        document.getElementById("sourceRemark").value = "";
    }

    generateSourceResult();
}

function generateSourceResult() {
    const origSource = document.getElementById("origSource").value;
    const detail = document.getElementById("sourceDetailSelect").value;
    const remark = document.getElementById("sourceRemark").value.trim();

    let result = `Original Source: ${origSource} | Source Detail: ${detail}`;
    if (remark) {
        result += ` | Remark: ${remark}`;
    }

    document.getElementById("srcResult").innerText = result;
}

// 初始化加载
updateSourceDetailsOptions();
</script>
